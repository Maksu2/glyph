traffic_budget:
  regular_peak_rate_commands_per_s: 0.673
  brief_return_pair_spacing_ms: 160
  bulbs_receive_micro_cues: false
  aqara_receive_micro_cues: false
  design_rule: Never translate every detected onset or every 80.75 BPM beat into a ZigBee command.

manual_acceptance_required:
  - Verify perceived beat/downbeat phase, especially M11 at 1:33.716.
  - Verify minimum stable brightness for both bulbs in white mode.
  - Verify transition support and actual transition curve on all three dimmable lights.
  - Map Aqara left/right endpoints to the physical large-light circuits and judge whether either ON step is too aggressive.
  - Validate the 163 ms model with the eventual playback program; MP3 reports a 25.057 ms stream start time.
  - Approve the final scene with and without the optional Aqara cues.
