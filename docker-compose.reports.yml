name: glyph-reports

services:
  report-downloads:
    image: python:3.12-alpine
    init: true
    user: "${GLYPH_REPORTS_UID:-1000}:${GLYPH_REPORTS_GID:-1000}"
    working_dir: /srv/reports
    command: ["python", "/srv/report_download_server.py"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    tmpfs:
      - /tmp:size=256m,mode=1777
    ports:
      - "${GLYPH_REPORTS_BIND:-0.0.0.0}:${GLYPH_REPORTS_PORT:-8101}:8101"
    volumes:
      - type: bind
        source: "${AI_MODEL_ROOT:-/home/maksu/ai-model}/report-downloads"
        target: /srv/reports
        read_only: true
      - type: bind
        source: "${AI_MODEL_ROOT:-/home/maksu/ai-model}/scripts/report_download_server.py"
        target: /srv/report_download_server.py
        read_only: true
    environment:
      GLYPH_REPORTS_ROOT: /srv/reports
      GLYPH_REPORTS_HOST: 0.0.0.0
      GLYPH_REPORTS_PORT: "8101"
      GLYPH_REPORTS_MAX_FILES: "250"
      GLYPH_REPORTS_MAX_TOTAL_BYTES: "268435456"
    restart: unless-stopped
